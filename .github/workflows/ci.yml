name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Starts a throwaway PostgreSQL with Testcontainers; Docker is preinstalled on the runner.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  docker:
    name: Docker images and browser test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build the images
        run: docker compose build

      - name: Start the system on an empty database
        run: docker compose up -d --wait

      - name: Serve the start page and the seeded quiz
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/quiz | grep -q '"questions"'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @boosta/web exec playwright install --with-deps chromium

      # The whole funnel in a real browser, against the production images.
      - name: Browser test
        run: pnpm test:browser

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Keep the browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
