schema: spec-driven

context: |
  Test task: an ADHD test funnel (quiz -> account creation -> report -> sign in).
  The brief evaluates functionality, architecture and implementation quality; pixel-perfect UI is not evaluated.
  All artifacts, documentation, code comments and commit messages are written in English.
  Commits follow Conventional Commits (enforced by commitlint).
  Fixed stack: Next.js (App Router) + CSS Modules, NestJS + TypeORM + class-validator, PostgreSQL,
  pnpm workspaces, Jest, Testcontainers, ESLint + Prettier with import sorting.
  The client and the server are separate applications.
  The brief PDF and Figma screenshots are local-only and must not be committed.

rules:
  tasks:
    - Each task group ends in a state that passes lint, typecheck and tests, so it can be committed on its own

operations:
  apply:
    guidance:
      - Implement one task group at a time, then stop and wait for the owner's confirmation before starting the next group
      - Before any HTML, CSS or client-side JavaScript work in apps/web, load the modern-web-guidance skill and follow it
      - After implementing a group, run the code-reviewer subagent on its diff and resolve every blocking finding
      - Then run the qa-tester subagent to verify the group's spec scenarios against the running system
      - Make one Conventional Commit per task group and push it to main, only after both subagents pass
      - In the stop report, include the reviewer's findings and the tester's results as they were returned
      - Do not add scope beyond tasks.md; record ideas in the README section on what was not done
