# PostgreSQL only, for running the API and the web app on the host during development.
name: boosta-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boosta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boosta}
      POSTGRES_DB: ${POSTGRES_DB:-boosta}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
