# The whole system with one command:
#
#   docker compose up --build
#
# then open http://localhost:3000. The database starts empty; the API creates
# the schema and the default quiz when it starts.
#
# The applications run in production mode with three relaxations that suit a
# local run only: a default signing secret, a session cookie without the Secure
# flag (plain HTTP) and Swagger UI switched on.
name: boosta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boosta
      POSTGRES_PASSWORD: boosta
      POSTGRES_DB: boosta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boosta -d boosta']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://boosta:boosta@postgres:5432/boosta
      # Override for anything beyond a local run: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-local-docker-compose-secret-0123456789abcdef}
      # This setup is served over plain http://localhost, where some browsers
      # refuse Secure cookies. Behind HTTPS, remove this line.
      COOKIE_SECURE: 'false'
      # Swagger UI at http://localhost:3001/api/docs, for reviewing the API.
      API_DOCS_ENABLED: 'true'
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Browsers call /api on the web app, which forwards to the API here.
      API_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
